name: DEPLOY - Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run only - no publish (default: true)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  publish:
    name: Publish Release
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: SETUP - Checkout
        uses: actions/checkout@v6

      - name: SETUP - .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: FETCH - Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.release_tag }}" --pattern "*.nupkg" --dir dist

      - name: DEBUG - List downloaded packages
        run: |
          echo "=== Release: ${{ inputs.release_tag }} ==="
          ls -la dist/

      - name: DRY RUN - Would publish (skipped)
        if: inputs.dry_run == 'true'
        run: |
          echo "=== DRY RUN MODE ==="
          echo "Would publish release: ${{ inputs.release_tag }}"
          echo "Packages:"
          ls -la dist/
          echo ""
          echo "To actually publish, re-run with dry_run=false"

      - name: DEPLOY - Publish to NuGet
        if: inputs.dry_run == 'false'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          for pkg in dist/*.nupkg; do
            echo "Publishing: $(basename $pkg)"
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
